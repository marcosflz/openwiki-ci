services:
  api:
    build:
      context: .
      args:
        OPENWIKI_VERSION: ${OPENWIKI_VERSION:-0.6.0}
    image: openwiki-ci:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # Single-container mode: run one worker inside the API process.
      # RUN_LOCAL_WORKER: "true"
    volumes:
      - openwiki-ci-data:/data
    restart: unless-stopped

  # Scales horizontally: docker compose up -d --scale worker=4
  worker:
    image: openwiki-ci:latest
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      JOB_TIMEOUT_MINUTES: ${JOB_TIMEOUT_MINUTES:-60}
    volumes:
      - openwiki-ci-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  openwiki-ci-data:
